<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_02.css">

    <title>Housemate Page</title>

</head>
<body>
    <main class="container">
        <form>
            <h1>Cadastre-se</h1>
            <div class="input-box">
                <input placeholder="E-mail" type="email">
                
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password">
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    lembrar minha senha
                </label>
                
            </div>

            <button type="submit" class="login">Enviar</button>

            <div class="register-link">
                <p>Já possue uma conta?<a href="login.html">Faça login</a></p>
            </div>
        </form>
    </main>
   
    
</body>
</html>
